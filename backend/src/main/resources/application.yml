spring:
  application:
    name: budgetbuddy

  datasource:
    url: jdbc:h2:mem:budgetbuddy;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

budgetbuddy:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5173
  chat:
    openai-api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.5}
    timeout-seconds: 45
    max-input-length: 2000
  app:
    timezone: Asia/Kolkata
    base-url: http://localhost:8080

app:
  timezone: Asia/Kolkata

logging:
  level:
    org.hibernate.SQL: warn
    com.budgetbuddy: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  error:
    whitelabel:
      enabled: false
